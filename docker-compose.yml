services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: erpilot_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erpilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erpilot_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - ./connectors:/app/connectors
      - ./workers:/app/workers
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erpilot_worker
    restart: unless-stopped
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    container_name: erpilot_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  dolibarr_db:
    image: mariadb:10.11
    container_name: erpilot_dolibarr_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=dolibarr
      - MYSQL_DATABASE=dolibarr
      - MYSQL_USER=dolibarr
      - MYSQL_PASSWORD=dolibarr
    volumes:
      - dolibarr_db_data:/var/lib/mysql

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: erpilot_dolibarr
    ports:
      - "8082:80"
    environment:
      - DOLI_DB_HOST=dolibarr_db
      - DOLI_DB_NAME=dolibarr
      - DOLI_DB_USER=dolibarr
      - DOLI_DB_PASSWORD=dolibarr
    depends_on:
      - dolibarr_db
    restart: always

  erpnext:
    image: frappe/erpnext:latest
    container_name: erpilot_erpnext
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - erpnext_data:/home/frappe/frappe-bench/sites
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/method/frappe.auth.get_logged_user || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  dolibarr_db_data:
  erpnext_data:
