# TASK-036 · Nginx reverse proxy config
#
# Kullanım: bu dosya ./deploy/nginx.conf olarak kaydedilir,
# docker-compose.prod.yml'deki nginx servisi bunu mount eder.
#
# DEĞEŞTİRİLMESİ GEREKEN YER: "your-domain.com" -> gerçek alan adınız

server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt doğrulaması için (certbot ilk sertifikayı alırken kullanır)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP gelen her isteği HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Backend API -> /api/ altındaki her şeyi FastAPI container'ına yönlendir
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend -> geri kalan her şeyi Next.js container'ına yönlendir
    location / {
        proxy_pass http://web:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
